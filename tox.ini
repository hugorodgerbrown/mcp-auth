# Every check CI runs. `uv run tox` runs them all; `uv run tox -e <env>` runs one.
[tox]
envlist = fmt, lint, types, test

[testenv]
base_python = py314
passenv =
    SSL_CERT_FILE
    REQUESTS_CA_BUNDLE
    *_PROXY
    *_proxy
runner = uv-venv-lock-runner
uv_sync_flags = --frozen

[testenv:fmt]
description = Formatting (ruff format)
dependency_groups = lint
commands = ruff format --check .

[testenv:lint]
description = Linting and bandit security rules (ruff)
dependency_groups = lint
commands = ruff check .

[testenv:types]
description = Type checking (mypy + django-stubs)
dependency_groups = types
commands = mypy

[testenv:test]
description = The contract suite and unit tests, with coverage
dependency_groups = test
commands = pytest --cov --cov-report=term-missing:skip-covered {posargs}
